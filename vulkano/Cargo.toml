# Modified for the VMNL fallback package on crates.io.

[package]
name = "vmnl_vulkano"
version = "0.35.2-vmnl.3"
publish = ["crates-io"]
authors = ["Pierre Krieger <pierre.krieger1708@gmail.com>", "The vulkano contributors"]
repository = "https://github.com/HugoDuda/vulkano"
homepage = "https://github.com/HugoDuda/vulkano/tree/vmnl/0.35.2"
description = "Vulkano 0.35.2 with device-loss and swapchain cleanup backports for VMNL Graphics"
documentation = "https://docs.rs/vmnl_vulkano"
readme = "README.md"
build = "build.rs"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[lib]
name = "vulkano"

[dependencies]
ash = { workspace = true }
bytemuck = { workspace = true, features = ["derive", "min_const_generics"] }
crossbeam-queue = { workspace = true }
foldhash = { workspace = true }
half = { workspace = true, features = ["bytemuck"] }
libloading = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true, features = ["send_guard"] }
raw-window-handle = { workspace = true, features = ["std"] }
serde = { workspace = true, optional = true }
slabbin = { workspace = true }
smallvec = { workspace = true }
thread_local = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
raw-window-metal = { workspace = true }

[target.'cfg(any(target_os = "dragonfly", target_os = "freebsd", target_os = "hurd", target_os = "illumos", target_os = "linux", target_os = "netbsd", target_os = "openbsd", target_os = "solaris"))'.dependencies]
x11-dl = { workspace = true, optional = true }
x11rb = { workspace = true, features = ["allow-unsafe-code"], optional = true }

[build-dependencies]
foldhash = { workspace = true }
heck = { workspace = true }
indexmap = { workspace = true }
nom = { workspace = true }
once_cell = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
vk-parse = { workspace = true }

[dev-dependencies]
libc = "0.2.153"

[features]
default = ["x11"]
document_unchecked = []
x11 = ["dep:x11-dl", "dep:x11rb"]

[lints]
workspace = true
